<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mary Lau — Citi Commercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16283D;
    --stone:#EDE8DE;
    --paper:#FAF7F2;
    --brass:#A6824F;
    --brass-dim:#A6824F55;
    --ink:#22201C;
    --ink-soft:#5B564C;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{
    height:100%;
    background:var(--stone);
    font-family:'IBM Plex Sans',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:28px 18px;
  }

  .card{
    width:100%;
    max-width:400px;
    background:var(--paper);
    border-radius:2px;
    box-shadow:0 1px 2px rgba(22,40,61,0.06), 0 12px 32px rgba(22,40,61,0.10);
    overflow:hidden;
    position:relative;
  }

  /* --- Signature: faint architectural floor-plan linework --- */
  .blueprint{
    position:relative;
    padding:44px 0 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:var(--navy);
  }

  .blueprint svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0.16;
  }

  .avatar{
    position:relative;
    width:96px;
    height:96px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid var(--brass);
    box-shadow:0 0 0 5px var(--navy), 0 0 0 6px var(--brass-dim);
  }

  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .identity{
    padding:30px 34px 8px;
    text-align:center;
  }

  .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:29px;
    letter-spacing:0.01em;
    color:var(--navy);
    line-height:1.15;
  }

  .role{
    margin-top:6px;
    font-size:14px;
    color:var(--ink-soft);
    letter-spacing:0.01em;
  }

  .org{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:11.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
    font-weight:600;
  }

  .org .dot{
    width:3px;height:3px;border-radius:50%;background:var(--brass);
    display:inline-block;
  }

  .save{
    display:block;
    margin:26px 34px 6px;
    padding:14px 0;
    text-align:center;
    background:var(--navy);
    color:var(--paper);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.03em;
    border-radius:1px;
    transition:background 0.15s ease;
  }

  .save:active{
    background:#0E1C2C;
  }

  .details{
    padding:22px 34px 34px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .row{
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    color:var(--ink);
  }

  .row .icon{
    flex:0 0 auto;
    width:18px;
    height:18px;
    color:var(--brass);
  }

  .row .text{
    display:flex;
    flex-direction:column;
    gap:1px;
  }

  .row .label{
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .row .value{
    font-size:15px;
    color:var(--ink);
  }

  .divider{
    height:1px;
    background:linear-gradient(to right, transparent, var(--brass-dim), transparent);
    margin:2px 34px 0;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:14px;
    padding:2px 34px 24px;
  }

  .socials a{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--brass-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--navy);
    text-decoration:none;
    transition:background 0.15s ease, border-color 0.15s ease;
  }

  .socials a:active{
    background:var(--stone);
    border-color:var(--brass);
  }

  .socials svg{
    width:17px;
    height:17px;
  }

  .foot{
    text-align:center;
    padding:16px 20px 22px;
    font-size:10.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  @media (prefers-reduced-motion: no-preference){
    .save{ transition:background 0.15s ease, transform 0.15s ease; }
    .save:active{ transform:scale(0.99); }
  }

  a:focus-visible, .save:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:2px;
  }
</style>
</head>
